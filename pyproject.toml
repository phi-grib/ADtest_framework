# This file tells pip how to build your package and defines all package metadata.
# The heavy dependencies are managed by conda via environment.yml.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adtest_framework"
version = "0.0.1"
authors = [{ name="Eric March", email="eric.march@upf.edu" }]
description = "A package for robust Applicability Domain (AD) analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# --- Dependencies (Pip-Managed Only) ---
# This list now ONLY contains packages that cannot be installed from conda.
dependencies = [
    "appdirs",
    "Data_curation @ git+https://github.com/phi-grib/Data_curation.git@f45c0aa2feaed863d1d14e2b998b0c8fc4fc3eb7",
    "icd @ git+https://github.com/topspinj/medcodes.git@b4a6aae29b8cea5a6af75b60071d85189ed96fc2",
]

[project.urls]
Homepage = "https://github.com/phi-grib/ADtest_paper1"

# The dev dependencies are now managed by conda in environment.yml.
# This section is now empty but can be kept for documentation.
[project.optional-dependencies]
dev = []

[project.scripts]
adtest = "ad_test.main:main"

# --- Package Discovery ---
# This explicitly tells setuptools where to find your package code.
[tool.setuptools.packages.find]
include = ["ad_test", "ad_test.*"]